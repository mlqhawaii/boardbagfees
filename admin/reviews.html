<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="robots" content="noindex,nofollow" />
  <title>Traveler Report Moderation | BoardBagFees</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <header class="admin-header"><a href="/" class="brand">BOARD BAG FEES</a><nav class="admin-nav"><a class="active" href="/admin/reviews">Traveler reports</a><a href="/admin/messages">Contact messages</a><a href="/admin/quality">Policy QC</a></nav></header>
  <main class="admin-main">
    <section class="login-card" id="loginCard">
      <h1>Admin moderation</h1><p>Enter the BoardBagFees moderation password.</p>
      <form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required><button>Open moderation queue</button></form>
      <p class="status" id="loginStatus"></p>
    </section>
    <section class="queue" id="queue" hidden>
      <div class="queue-head"><div><h1>Traveler reports</h1><p>Approve useful firsthand reports or reject spam/test submissions.</p></div><button class="secondary" id="logout">Log out</button></div>
      <div class="tabs" role="group"><button data-status="pending" class="active">Pending</button><button data-status="approved">Approved</button><button data-status="rejected">Rejected</button><button data-status="all">All</button></div>
      <p class="status" id="queueStatus"></p><div id="cards" class="cards"></div>
    </section>
  </main>
  <script defer src="/admin/admin.js"></script>
</body>
</html>
