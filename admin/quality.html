<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><meta name="robots" content="noindex,nofollow"/><title>Policy Quality Review | BoardBagFees</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"/></head>
<body><header class="admin-header"><a href="/" class="brand">BOARD BAG FEES</a><nav class="admin-nav"><a href="/admin/reviews">Traveler reports</a><a href="/admin/messages">Contact messages</a><a class="active" href="/admin/quality">Policy QC</a></nav></header>
<main class="admin-main"><section class="login-card" id="loginCard"><h1>Admin moderation</h1><p>Enter the BoardBagFees moderation password.</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required><button>Open quality queue</button></form><p class="status" id="loginStatus"></p></section>
<section class="queue" id="queue" hidden><div class="queue-head"><div><h1>Policy quality control</h1><p>Only suspicious policy changes land here. Green updates continue automatically.</p></div><button class="secondary" id="logout">Log out</button></div><div class="qc-key"><span><i class="qc-dot green"></i> Auto-applied</span><span><i class="qc-dot yellow"></i> Review recommended</span><span><i class="qc-dot red"></i> Failed / low confidence</span></div><div class="tabs" role="group"><button data-status="pending" class="active">Needs review</button><button data-status="apply_failed">Failed</button><button data-status="approved">Approved</button><button data-status="kept_current">Kept current</button><button data-status="auto_applied">Auto-applied</button><button data-status="all">All</button></div><p class="status" id="queueStatus"></p><div id="cards" class="cards"></div></section></main><script defer src="/admin/quality.js"></script></body></html>
